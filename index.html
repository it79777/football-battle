<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P.Win Football Arena – Battle of Legends</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: linear-gradient(180deg, #012, #023);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      direction: rtl;
    }

    header {
      width: 100%;
      text-align: center;
      padding: 15px;
      background: #014;
      font-size: 1.3em;
      font-weight: bold;
      color: gold;
    }

    #link {
      color: #8ef;
      text-decoration: none;
      font-size: 0.9em;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
    }

    #start {
      background: #0f0;
      color: #001;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 1em;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 20px;
    }

    #arena {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      gap: 20px;
    }

    .player {
      background: rgba(255,255,255,0.08);
      padding: 15px;
      border-radius: 12px;
      width: 42%;
      min-width: 200px;
      font-size: 1.2em;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.2s;
    }

    .player:hover {
      background: rgba(255,255,255,0.15);
    }

    .winner {
      border: 2px solid gold;
      color: gold;
    }

    #info {
      margin-top: 20px;
      color: #9ef;
      font-weight: bold;
    }

    footer {
      padding: 10px;
      text-align: center;
      font-size: 0.9em;
      background: #012;
      width: 100%;
    }

    @media(max-width:600px){
      .player{width:90%;}
    }
  </style>
</head>
<body>
  <header>
    🏆 P.Win Football Arena – Battle of Legends <br>
    <a id="link" href="https://www.aparat.com/p_win" target="_blank">aparat.com/p_win</a>
  </header>

  <main>
    <button id="start">Start Game</button>
    <div id="arena"></div>
    <div id="info"></div>
  </main>

  <footer>
    © P.Win – All Rights Reserved
  </footer>

  <script>
    const players = [
      "Shrek", "Antony", "Harry Maguire",
      "Messi", "Cristiano Ronaldo", "Neymar", "Mbappe", "Haaland",
      "Ronaldinho", "Pele", "Maradona", "Zidane", "Beckham", "Kaka", "Xavi", "Iniesta",
      "Totti", "Van Persie", "Roberto Carlos", "Sergio Ramos", "Luis Figo",
      "Suarez", "Lewandowski", "Modric", "Benzema", "Mohamed Salah",
      "Kevin De Bruyne", "Pogba", "Griezmann", "Kroos", "Busquets",
      "Rooney", "Lampard", "Gerrard", "Shearer", "Maldini", "Buffon",
      "George Weah", "Baggio", "Bale", "John Terry", "Rudiger",
      "Pedri", "Gavi", "Bruno Fernandes", "Sancho", "Foden",
      "Mane", "Firmino", "Vardy", "Harry Kane", "Rashford",
      "Lautaro Martinez", "Robertson", "Koulibaly", "Richarlison",
      "Di Maria", "Verratti", "Ibrahimovic", "Ribery", "Kluivert",
      "Adriano", "Casillas", "Ozil", "Thiago Silva", "Dybala",
      "Ederson", "Vinicius Jr", "Alisson", "Cancelo", "Fabinho",
      "Kante", "Sterling", "Grealish", "Walker", "Varane",
      "Courtois", "Mount", "Son Heung-min", "Dembele", "De Jong",
      "Chiesa", "Pjanic", "Perisic", "Bonucci", "Chiellini",
      "Lloris", "Oblak", "Ziyech", "Hakimi", "Shaw",
      "Declan Rice", "Enzo Fernandez", "Musiala", "Rodri", "Felix",
      "Araujo", "Alaba", "Reece James", "Martinez", "Szczesny"
    ];

    let remaining = [];
    let champion = null;
    let opponent = null;
    const arena = document.getElementById("arena");
    const info = document.getElementById("info");
    const startBtn = document.getElementById("start");

    startBtn.addEventListener("click", startGame);

    function startGame() {
      remaining = shuffle([...players]);
      champion = remaining.pop();
      opponent = remaining.pop();
      renderMatch();
      startBtn.style.display = "none";
    }

    function renderMatch() {
      arena.innerHTML = "";
      const p1 = createCard(champion, true);
      const p2 = createCard(opponent, false);
      arena.appendChild(p1);
      arena.appendChild(p2);
      info.textContent = `Remaining Players: ${remaining.length}`;
    }

    function createCard(name, isChampion) {
      const div = document.createElement("div");
      div.className = "player" + (isChampion ? " winner" : "");
      div.textContent = name;
      div.addEventListener("dblclick", () => selectWinner(name));
      div.addEventListener("touchend", (e) => handleDoubleTap(e, name));
      return div;
    }

    let lastTap = 0;
    function handleDoubleTap(e, name) {
      const now = Date.now();
      if (now - lastTap < 300) {
        e.preventDefault();
        selectWinner(name);
      }
      lastTap = now;
    }

    function selectWinner(name) {
      champion = name;
      if (remaining.length > 0) {
        opponent = remaining.pop();
        renderMatch();
      } else {
        arena.innerHTML = `<div class='player winner'>🏆 Champion: ${champion}</div>`;
        info.textContent = "Game Over!";
      }
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
  </script>
</body>
</html>
