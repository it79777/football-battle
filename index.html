<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P.Win Football Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #000428, #004e92);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }
    header {
      text-align: center;
      width: 100%;
      padding: 15px;
      background: rgba(0,0,0,0.5);
      font-size: 1.4em;
      color: gold;
    }
    #arena {
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 900px;
      margin-top: 30px;
      padding: 10px;
    }
    .player {
      width: 42%;
      min-width: 200px;
      background: rgba(255,255,255,0.1);
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      font-size: 1.2em;
      cursor: pointer;
      transition: 0.2s;
      border: 2px solid transparent;
    }
    .player:hover {
      background: rgba(255,255,255,0.2);
    }
    .winner {
      border: 2px solid gold;
      color: gold;
    }
    #info {
      margin-top: 20px;
      color: #aef;
    }
    #start {
      background: #0f0;
      color: #001;
      border: none;
      padding: 10px 25px;
      border-radius: 10px;
      font-size: 1em;
      cursor: pointer;
      font-weight: bold;
      margin-top: 30px;
    }
    footer {
      margin-top: auto;
      padding: 10px;
      text-align: center;
      font-size: 0.9em;
      background: rgba(0,0,0,0.4);
      width: 100%;
    }
  </style>
</head>
<body>
  <header>🏆 P.Win Football Arena</header>
  <button id="start">Start Game</button>
  <div id="arena"></div>
  <div id="info"></div>
  <footer><a href="https://www.aparat.com/p_win" style="color:skyblue;text-decoration:none;">aparat.com/p_win</a></footer>

  <script>
    const players = [
      "Shrek", "Antony", "Harry Maguire", "Messi", "Ronaldo", "Neymar", "Mbappe", "Haaland",
      "Zidane", "Ronaldinho", "Beckham", "Kaka", "Xavi", "Iniesta", "Totti", "Ramos",
      "Suarez", "Lewandowski", "Modric", "Salah", "De Bruyne", "Griezmann", "Kroos", "Busquets",
      "Rooney", "Lampard", "Gerrard", "Maldini", "Buffon", "Weah", "Baggio", "Bale",
      "Pedri", "Gavi", "Bruno Fernandes", "Foden", "Mane", "Firmino", "Vardy", "Harry Kane",
      "Rashford", "Robertson", "Koulibaly", "Richarlison", "Di Maria", "Verratti", "Ibrahimovic",
      "Ribery", "Casillas", "Ozil", "Dybala", "Vinicius Jr", "Alisson", "Cancelo", "Kante",
      "Sterling", "Grealish", "Walker", "Varane", "Courtois", "Mount", "Son", "Dembele",
      "De Jong", "Chiesa", "Perisic", "Bonucci", "Chiellini", "Lloris", "Oblak", "Ziyech",
      "Hakimi", "Shaw", "Rice", "Fernandez", "Musiala", "Rodri", "Felix", "Araujo",
      "Alaba", "Reece James", "Martinez", "Szczesny", "Pele", "Maradona", "Figo", "Benzema",
      "Modeste", "David Villa", "Tevez", "Torres", "Morata", "Gundogan", "Pique", "Varatti",
      "Hummels", "Boateng", "Dani Alves", "Chiellini", "Kompany", "Bonucci"
    ];

    let remaining = [];
    let champion = null;
    let opponent = null;
    const arena = document.getElementById("arena");
    const info = document.getElementById("info");
    const startBtn = document.getElementById("start");

    startBtn.addEventListener("click", startGame);

    function startGame() {
      remaining = shuffle([...players]);
      champion = remaining.pop();
      opponent = remaining.pop();
      renderMatch();
      startBtn.style.display = "none";
    }

    function renderMatch() {
      arena.innerHTML = "";
      const p1 = createCard(champion, true);
      const p2 = createCard(opponent, false);
      arena.appendChild(p1);
      arena.appendChild(p2);
      info.textContent = `Remaining Players: ${remaining.length}`;
    }

    function createCard(name, isChampion) {
      const div = document.createElement("div");
      div.className = "player" + (isChampion ? " winner" : "");
      div.textContent = name;
      div.addEventListener("dblclick", () => selectWinner(name));
      div.addEventListener("touchend", (e) => handleDoubleTap(e, name));
      return div;
    }

    let lastTap = 0;
    function handleDoubleTap(e, name) {
      const now = Date.now();
      if (now - lastTap < 300) {
        e.preventDefault();
        selectWinner(name);
      }
      lastTap = now;
    }

    function selectWinner(name) {
      champion = name;
      if (remaining.length > 0) {
        opponent = remaining.pop();
        renderMatch();
      } else {
        arena.innerHTML = `<div class='player winner'>🏆 Champion: ${champion}</div>`;
        info.textContent = "Game Over!";
      }
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
  </script>
</body>
</html>
