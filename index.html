<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>p.win presents ⚽ نبرد فوتبالیست‌ها</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- START SCREEN -->
  <div id="startScreen" class="start-screen">
    <div class="start-card">
      <h1>p.win presents</h1>
      <h2>⚽ نبرد فوتبالیست‌ها</h2>
      <p class="sub">روی بازیکنی که فکر می‌کنی بهتره کلیک کن — برنده ادامه می‌ده!</p>
      <button id="startBtn">شروع بازی 🎮</button>
    </div>
  </div>

  <!-- MAIN GAME -->
  <main id="game" class="container hidden" role="main" aria-live="polite">
    <h1 class="title">نبرد فوتبالیست‌ها ⚽</h1>
    <p class="hint">روی بازیکنی که به نظرت بهتره کلیک کن تا با رقیب جدید روبرو بشه.</p>

    <div id="battle" class="battle">
      <div class="player-card" id="player1" tabindex="0" role="button" aria-label="بازیکن اول"></div>
      <div class="vs">VS</div>
      <div class="player-card" id="player2" tabindex="0" role="button" aria-label="بازیکن دوم"></div>
    </div>

    <div id="winner" class="winner" aria-live="polite"></div>
    <div class="controls">
      <button id="restart">شروع مجدد 🔁</button>
      <button id="showList">مشاهده لیست بازیکنان</button>
    </div>

    <div id="playerList" class="player-list hidden">
      <h3>لیست بازیکنان (قابل ویرایش در script.js)</h3>
      <textarea id="playersTextarea" rows="10" readonly></textarea>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
