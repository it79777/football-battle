<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p.win Football Battle ⚽🔥</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="start-screen">
    <h1>⚽ p.win Football Battle ⚡</h1>
    <button id="start-btn">شروع بازی</button>
  </div>

  <div id="game-screen" class="hidden">
    <h2>کلیک کن و برنده رو انتخاب کن 👇</h2>
    <div class="players">
      <div class="player" id="player1"></div>
      <span class="vs">VS</span>
      <div class="player" id="player2"></div>
    </div>
    <div id="winner"></div>
    <button id="fight-btn">بازی بعدی 🔁</button>
  </div>

  <footer>ساخته شده توسط <strong>p.win</strong> 💥</footer>

  <script src="script.js"></script>
</body>
</html>
