<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🏆 P.Win Football Arena – Battle of Legends</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>🏆 P.Win Football Arena</h1>
      <p class="subtitle">Battle of Legends</p>
    </div>
    <nav><a href="https://www.aparat.com/p_win" target="_blank">🎥 کانال Aparat</a></nav>
  </header>

  <main class="stage">
    <div class="controls">
      <button id="start" class="btn">شروع بازی</button>
      <button id="next" class="btn hidden">مرحله بعد</button>
      <span id="round" class="round hidden"></span>
    </div>

    <section id="arena" class="arena">
      <!-- کارت‌ها در اینجا رندر می‌شن -->
    </section>

    <div id="info" class="info"></div>
  </main>

  <footer class="footer">
    <a href="https://www.aparat.com/p_win" target="_blank">https://www.aparat.com/p_win</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
